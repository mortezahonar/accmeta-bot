name: accmeta-bot

on:
  repository_dispatch:
    types: [telegram]

  workflow_dispatch:
    inputs:
      poll:
        description: "Read updates with getUpdates (only when no webhook is set)"
        type: boolean
        default: false
      identify_chat:
        description: "Find the numeric target group ID using one /chatid update"
        type: boolean
        default: false
      test_key:
        description: "Only check that the Gemini key works (no bot run)"
        type: boolean
        default: false

      migrate_webhook:
        description: "Explicitly replace the current Telegram webhook with accmeta-hook"
        type: boolean
        default: false
      register_commands:
        description: "Register /start in the Telegram command menu"
        type: boolean
        default: false

  schedule:
    - cron: '17 * * * *'

concurrency:
  group: accmeta-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ACCMETA_BOT_TOKEN: ${{ secrets.ACCMETA_BOT_TOKEN }}
      ACCMETA_CHAT_ID: ${{ secrets.ACCMETA_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FALLBACK_API_KEY: ${{ secrets.FALLBACK_API_KEY }}
      ACCMETA_GLOSSARY: ${{ github.workspace }}/data/accounting-glossary.md

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shared provider regression tests
        run: |
          php tests/SharedProviderPolicyTest.php
          php tests/HttpRedactionTest.php
          php tests/TelegramRichMessageTest.php
          php tests/GeminiRetryTest.php
          php tests/OpenAiCompatibleRetryTest.php

      - name: Chat ID diagnostic regression test
        run: php tests/ChatIdDiagnosticTest.php

      - name: Start command regression test
        run: php tests/StartCommandTest.php

      - name: RTL direction regression test
        run: php tests/PersianRtlTest.php

      - name: Telegram publication retry regression test
        run: php tests/TelegramRateLimitTest.php

      - name: Article source and translation tests
        run: |
          php tests/InternationalArticleSourceTest.php
          php tests/ArticleServiceBatchTest.php
          php tests/TranslationCodeBlockTest.php
          php tests/TranslationLinkPreservationTest.php
          php tests/TranslationPromptFilterTest.php
          php tests/TranslationTermsTest.php

      - name: Register Telegram /start command
        if: github.event_name == 'workflow_dispatch' && inputs.register_commands
        env:
          ACCMETA_BOT_TOKEN: ${{ secrets.ACCMETA_BOT_TOKEN }}
        run: |
          current=$(curl -sS --fail --max-time 30 \
            "https://api.telegram.org/bot${ACCMETA_BOT_TOKEN}/getMyCommands")
          printf '%s' "$current" | jq -e '.ok == true' >/dev/null
          commands=$(printf '%s' "$current" | jq -c \
            '[.result[]? | select(.command != "start")] + [{"command":"start","description":"شروع و راهنمای ربات"}]')
          payload=$(jq -cn --argjson commands "$commands" '{commands:$commands}')
          response=$(curl -sS --fail --max-time 30 -X POST \
            "https://api.telegram.org/bot${ACCMETA_BOT_TOKEN}/setMyCommands" \
            -H 'Content-Type: application/json' -d "$payload")
          printf '%s' "$response" | jq -e '.ok == true' >/dev/null
          echo "Telegram /start command registered; existing commands preserved."

      - name: Gemini key check
        if: github.event_name == 'workflow_dispatch' && inputs.test_key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Gemini key check: missing repository secret GEMINI_API_KEY."
            exit 1
          fi

          code=$(curl -sS -o /tmp/gem.json -w "%{http_code}" --max-time 60 \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"reply with OK only"}]}],"generationConfig":{"maxOutputTokens":20}}')
          if [ "$code" = "200" ]; then
            echo "Gemini key check: HTTP 200; response received."
          else
            api_status=$(jq -r 'try (.error.status // "") catch ""' /tmp/gem.json 2>/dev/null)
            message=$(jq -r 'try (.error.message // "") catch ""' /tmp/gem.json 2>/dev/null)
            case "$message" in
              *"API key not valid"*) reason="key rejected" ;;
              *"API has not been used"*|*"is disabled"*) reason="API/project disabled" ;;
              *"blocked"*) reason="key restriction" ;;
              *) reason="provider rejected request" ;;
            esac
            echo "Gemini key check: HTTP $code; status=${api_status:-unknown}; reason=$reason"
          fi
          rm -f /tmp/gem.json
          test "$code" = "200"

      - name: Fetch the pending update
        if: github.event_name == 'repository_dispatch'
        env:
          HOOK_URL: ${{ secrets.ACCMETA_HOOK_URL }}
          HOOK_SECRET: ${{ secrets.ACCMETA_BOT_SECRET }}
          KEY: ${{ github.event.client_payload.key }}
        run: |
          mkdir -p /tmp/accmeta-bot
          curl -sS --fail --retry 3 --retry-connrefused \
            -H "X-Bot-Secret: $HOOK_SECRET" \
            "$HOOK_URL/pending/$KEY" -o /tmp/accmeta-bot/update.json
          test -s /tmp/accmeta-bot/update.json
          echo "Fetched pending Telegram update (${#KEY} key characters)."

      - name: Process the update
        if: github.event_name == 'repository_dispatch'
        run: php bot.php --update-file /tmp/accmeta-bot/update.json

      - name: Manual poll
        if: github.event_name == 'workflow_dispatch' && inputs.poll
        run: php bot.php --once

      - name: Identify target group chat ID
        if: github.event_name == 'workflow_dispatch' && inputs.identify_chat
        env:
          ACCMETA_BOT_TOKEN: ${{ secrets.ACCMETA_BOT_TOKEN }}
        run: bash scripts/identify_group_chat.sh

      - name: Webhook health check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.identify_chat)
        env:
          HOOK_URL: ${{ secrets.ACCMETA_HOOK_URL }}
          TELEGRAM_SECRET: ${{ secrets.ACCMETA_TELEGRAM_SECRET }}
          MIGRATE_WEBHOOK: ${{ inputs.migrate_webhook }}
        run: |
          if [ -z "$ACCMETA_BOT_TOKEN" ] || [ -z "$HOOK_URL" ] || [ -z "$TELEGRAM_SECRET" ]; then
            echo "Webhook health check skipped: target runtime secrets are not configured yet."
            exit 0
          fi
          test -n "$HOOK_URL"
          test -n "$TELEGRAM_SECRET"
          info=$(curl -sS "https://api.telegram.org/bot$ACCMETA_BOT_TOKEN/getWebhookInfo")
          current=$(printf '%s' "$info" | jq -r '.result.url')
          if [ "$current" != "$HOOK_URL" ]; then
            if [ -n "$current" ] && [ "$current" != "null" ] && [ "$MIGRATE_WEBHOOK" != "true" ]; then
              echo "A different webhook is already configured; refusing to replace it automatically."
              exit 1
            fi
            if [ -n "$current" ] && [ "$current" != "null" ]; then
              echo "Explicit migration requested; replacing the existing webhook with accmeta-hook."
            fi
            echo "Webhook URL differs; registering the accmeta-hook endpoint."
            curl -sS --fail -X POST "https://api.telegram.org/bot$ACCMETA_BOT_TOKEN/setWebhook" \
              -d "url=$HOOK_URL" \
              -d "secret_token=$TELEGRAM_SECRET" \
              --data-urlencode 'allowed_updates=["message","callback_query"]' \
              -o /dev/null
            echo "Webhook registration request completed."
          else
            echo "Webhook is already registered to the configured accmeta-hook endpoint."
          fi

      - name: Persist state (same public-repository behavior as JCM)
        if: always()
        run: |
          git config user.name "accmeta-bot"
          git config user.email "accmeta-bot@users.noreply.github.com"
          mkdir -p state
          git add -A state
          if git diff --cached --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
